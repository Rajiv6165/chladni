<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chladni Phase 1: Synth Core Test</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; }
        .control-group { display: flex; flex-direction: column; }
        .piano { display: flex; gap: 2px; user-select: none; }
        .key { width: 40px; height: 150px; background: white; color: black; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; cursor: pointer; border-radius: 0 0 5px 5px; }
        .key.black { width: 30px; height: 100px; background: black; color: white; margin-left: -15px; margin-right: -15px; z-index: 1; border-radius: 0 0 4px 4px; }
        .key:active, .key.active { background: #ccc; }
        .key.black:active, .key.black.active { background: #444; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Chladni Synth Core Test</h1>
    <button id="start-btn">Start Audio</button>
    <hr>
    
    <div class="controls">
        <div class="control-group">
            <label>Filter Cutoff</label>
            <input type="range" id="cutoff" min="20" max="10000" value="2000">
        </div>
        <div class="control-group">
            <label>Filter Resonance</label>
            <input type="range" id="resonance" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label>Reverb Mix</label>
            <input type="range" id="reverb" min="0" max="1" step="0.01" value="0.0">
        </div>
    </div>

    <div class="piano" id="piano">
        <!-- Generated by host.js -->
    </div>

    <script type="module" src="./host.js?v=9"></script>
</body>
</html>
